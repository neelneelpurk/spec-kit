name: Setup Python + uv
description: >-
  Install uv and Python and (optionally) sync InfraKit's dependencies. Shared by
  the CI jobs so the toolchain versions live in one place.

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.13"
  sync:
    description: Whether to run `uv sync --extra test` (set "false" for lint-only jobs)
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Sync dependencies
      if: ${{ inputs.sync == 'true' }}
      shell: bash
      run: uv sync --extra test
